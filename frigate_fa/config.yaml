name: Frigate (Full Access, troy)
version: 0.17.1-troy.18
breaking_versions:
  - 0.17.0
  - 0.16.0
  - 0.15.0
  - 0.14.0
panel_icon: "mdi:cctv"
panel_title: Frigate
slug: frigate-fa
description: NVR with realtime local object detection for IP cameras (TroyJ fork)
url: "https://github.com/TroyJ/frigate"
image: ghcr.io/troyj/frigate
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:5000]/"
# D16/F12: leave this pointing at `/`. Verified on the box 2026-08-27 — nginx's `location /`
# has no `auth_request` include and serves index.html from disk in ~1 ms, so this probe
# never reaches the single uvicorn worker. Pointing it at any `/api/...` path would make a
# busy API look like a dead add-on and hand the Supervisor a reason to recreate the
# container. The probe that DID do that is the image's Docker HEALTHCHECK (`/api/version`);
# it is widened in frigate-fork/overlay.Dockerfile, not here.
watchdog: "http://[HOST]:[PORT:5000]/"
ingress: true
ingress_port: 5000
ingress_entry: /
panel_admin: false
homeassistant_api: true
hassio_api: true
ports:
  8555/tcp: 8555
  8555/udp: 8555
  8554/tcp: null
  8971/tcp: null
  5000/tcp: null
  1984/tcp: null
  1935/tcp: null
ports_description:
  8555/tcp: WebRTC over tcp
  8555/udp: WebRTC over udp
  8554/tcp: RTSP Restream
  8971/tcp: Authenticated Web interface
  5000/tcp: Unauthenticated Web interface (not required for Home Assistant Ingress)
  1984/tcp: go2rtc API
host_network: false
tmpfs: true
video: true
full_access: true
privileged:
  - PERFMON
schema:
  plus_api_key: password?
  go2rtc_allow_arbitrary_exec: str?  
services:
  - "mqtt:want"
arch:
  - aarch64
map:
  - "media:rw"
  - "addon_config:rw"
  - "homeassistant_config:rw"
  - "ssl"
